<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cric Score Board Pro - Live Overlay</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

.overlay{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:900px;
    max-width:94%;
}

.brand{
    position:absolute;
    left:0;
    bottom:100%;
    margin-bottom:8px;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

.live{
    position:absolute;
    right:0;
    bottom:100%;
    margin-bottom:8px;
    background:#e51f2f;
    color:white;
    padding:6px 13px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.live-dot{
    display:inline-block;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    margin-right:5px;
}

.scorebar{
    height:82px;
    display:flex;
    align-items:stretch;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.55);
}

.team{
    width:23%;
    background:linear-gradient(135deg,#101d3d,#172e5e);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8px 18px;
}

.team-name{
    font-size:18px;
    font-weight:bold;
}

.team-status{
    font-size:12px;
    opacity:.75;
    margin-top:4px;
}

.score{
    width:24%;
    background:linear-gradient(135deg,#111,#252525);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:900;
}

.score span{
    font-size:16px;
    opacity:.75;
    margin-left:6px;
}

.overs{
    width:14%;
    background:#202020;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.overs strong{
    font-size:20px;
}

.overs small{
    font-size:11px;
    opacity:.7;
}

.players{
    flex:1;
    background:linear-gradient(135deg,#063c38,#087064);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:7px 15px;
}

.player{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin:2px 0;
}

.player b{
    color:#ffe66d;
}

@media(max-width:700px){

    .overlay{
        bottom:15px;
        width:96%;
    }

    .scorebar{
        height:65px;
    }

    .team{
        width:25%;
        padding:5px 8px;
    }

    .team-name{
        font-size:12px;
    }

    .team-status{
        font-size:9px;
    }

    .score{
        width:22%;
        font-size:23px;
    }

    .score span{
        font-size:11px;
    }

    .overs{
        width:13%;
    }

    .overs strong{
        font-size:14px;
    }

    .overs small{
        font-size:8px;
    }

    .players{
        padding:4px 7px;
    }

    .player{
        font-size:9px;
    }

    .brand{
        font-size:11px;
    }

    .live{
        font-size:9px;
        padding:4px 8px;
    }
}
</style>
</head>

<body>

<div class="overlay">

    <div class="brand">
        Cric Score Board Pro
    </div>

    <div class="live">
        <span class="live-dot"></span> LIVE
    </div>

    <div class="scorebar">

        <div class="team">
            <div class="team-name" id="teamName">
                AL MAHMOOD
            </div>
            <div class="team-status">
                Batting
            </div>
        </div>

        <div class="score">
            <span id="runs">0</span>/<span id="wickets">0</span>
            <span id="scoreOvers">(0.0)</span>
        </div>

        <div class="overs">
            <strong id="overs">0.0</strong>
            <small>OVERS</small>
        </div>

        <div class="players">

            <div class="player">
                <span id="player1">Ahmed</span>
                <b>LIVE</b>
            </div>

            <div class="player">
                <span id="player2">Bilal</span>
                <b>BAT</b>
            </div>

        </div>

    </div>

</div>

<script>

function loadScore(){

    const saved = localStorage.getItem("cricScorePro");

    if(!saved){
        return;
    }

    try{

        const score = JSON.parse(saved);

        document.getElementById("teamName").innerText =
            score.team || "TEAM A";

        document.getElementById("runs").innerText =
            score.runs || 0;

        document.getElementById("wickets").innerText =
            score.wickets || 0;

        const balls = score.balls || 0;

        const over = Math.floor(balls / 6);
        const ball = balls % 6;

        const overs = over + "." + ball;

        document.getElementById("overs").innerText = overs;

        document.getElementById("scoreOvers").innerText =
            "(" + overs + ")";

        document.getElementById("player1").innerText =
            score.batsman1 || "Batsman 1";

        document.getElementById("player2").innerText =
            score.batsman2 || "Batsman 2";

    }catch(error){

        console.log("Score data error:",error);

    }
}

/* Load score when overlay opens */
loadScore();

/* Automatically update when Admin Panel changes score */
window.addEventListener("storage", function(event){

    if(event.key === "cricScorePro"){
        loadScore();
    }

});

/* Check every second as an additional refresh */
setInterval(loadScore,1000);

</script>

</body>
</html>
