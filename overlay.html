<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cric Score Board Pro - Free Overlay</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

/* Main Overlay */
.overlay{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:900px;
    max-width:94%;
}

/* Branding */
.brand{
    position:absolute;
    left:0;
    bottom:100%;
    margin-bottom:8px;
    color:white;
    font-size:18px;
    font-weight:800;
    text-shadow:0 2px 5px #000;
    letter-spacing:.5px;
}

/* Score Bar */
.scorebar{
    height:82px;
    display:flex;
    align-items:stretch;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.55);
}

/* Team */
.team{
    width:23%;
    background:linear-gradient(135deg,#101d3d,#172e5e);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8px 18px;
}

.team-name{
    font-size:18px;
    font-weight:bold;
}

.team-status{
    font-size:12px;
    opacity:.75;
    margin-top:4px;
}

/* Score */
.score{
    width:24%;
    background:linear-gradient(135deg,#111,#252525);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:900;
}

.score span{
    font-size:16px;
    opacity:.75;
    margin-left:6px;
}

/* Overs */
.overs{
    width:14%;
    background:#202020;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.overs strong{
    font-size:20px;
}

.overs small{
    font-size:11px;
    opacity:.7;
}

/* Batsmen */
.players{
    flex:1;
    background:linear-gradient(135deg,#063c38,#087064);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:7px 15px;
}

.player{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin:2px 0;
}

.player b{
    color:#ffe66d;
}

/* Live */
.live{
    position:absolute;
    right:0;
    bottom:100%;
    margin-bottom:8px;
    background:#e51f2f;
    color:white;
    padding:6px 13px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
}

.live-dot{
    display:inline-block;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    margin-right:5px;
}

/* Mobile */
@media(max-width:700px){

    .overlay{
        bottom:15px;
        width:96%;
    }

    .scorebar{
        height:65px;
    }

    .team{
        width:25%;
        padding:5px 8px;
    }

    .team-name{
        font-size:12px;
    }

    .team-status{
        font-size:9px;
    }

    .score{
        width:22%;
        font-size:23px;
    }

    .score span{
        font-size:11px;
    }

    .overs{
        width:13%;
    }

    .overs strong{
        font-size:14px;
    }

    .overs small{
        font-size:8px;
    }

    .players{
        padding:4px 7px;
    }

    .player{
        font-size:9px;
    }

    .brand{
        font-size:11px;
    }

    .live{
        font-size:9px;
        padding:4px 8px;
    }
}
</style>
</head>

<body>

<div class="overlay">

    <div class="brand">
        Cric Score Board Pro
    </div>

    <div class="live">
        <span class="live-dot"></span> LIVE
    </div>

    <div class="scorebar">

        <!-- TEAM -->
        <div class="team">
            <div class="team-name">AL MAHMOOD</div>
            <div class="team-status">Batting</div>
        </div>

        <!-- SCORE -->
        <div class="score">
            127/4
            <span>(15.2)</span>
        </div>

        <!-- OVERS -->
        <div class="overs">
            <strong>15.2</strong>
            <small>OVERS</small>
        </div>

        <!-- PLAYERS -->
        <div class="players">

            <div class="player">
                <span>Ahmed</span>
                <b>52*</b>
            </div>

            <div class="player">
                <span>Bilal</span>
                <b>31</b>
            </div>

        </div>

    </div>

</div>

</body>
</html>
