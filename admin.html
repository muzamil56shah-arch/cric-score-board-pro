<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cric Score Board Pro - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071225;
    color:white;
}

.header{
    background:#0d1f45;
    padding:22px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:800px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:#101f38;
    border-radius:16px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2{
    margin-top:0;
    color:#38d9a9;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #344765;
    background:#071225;
    color:white;
    font-size:16px;
}

.score-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#16c784;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#11a96e;
}

#message{
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#123f2d;
    color:#58e6a9;
}

.error{
    background:#4a1720;
    color:#ff8c9a;
}

.current{
    margin-top:25px;
    padding:18px;
    background:#08172d;
    border-radius:12px;
}

.current-score{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
    🏏 Cric Score Board Pro — Admin Panel
</div>

<div class="container">

<div class="card">

<h2>Live Match Control</h2>

<label>Team A</label>
<input id="teamA" type="text" placeholder="Example: AL MAHMOOD">

<label>Team B</label>
<input id="teamB" type="text" placeholder="Example: AHMED XI">

<div class="score-box">

<div>
<label>Runs</label>
<input id="runs" type="number" value="0" min="0">
</div>

<div>
<label>Wickets</label>
<input id="wickets" type="number" value="0" min="0" max="10">
</div>

</div>

<button onclick="saveScore()">
    🔴 UPDATE LIVE SCORE
</button>

<div id="message"></div>

<div class="current">

<strong>Current Live Score</strong>

<div id="currentScore" class="current-score">
    No match data
</div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ivysqllrtppkjsrvyvuj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CWg86WW1Fcs-u1hgJ6d2Qg_q8M2wjIp";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let matchId = null;


// Load existing match
async function loadMatch(){

    const { data, error } = await supabaseClient
        .from("matches")
        .select("*")
        .order("created_at", { ascending:false })
        .limit(1);

    if(error){
        showMessage(error.message, false);
        return;
    }

    if(data && data.length > 0){

        const match = data[0];

        matchId = match.id;

        document.getElementById("teamA").value =
            match.team_a || "";

        document.getElementById("teamB").value =
            match.team_b || "";

        document.getElementById("runs").value =
            match.runs || 0;

        document.getElementById("wickets").value =
            match.wickets || 0;

        showCurrent(match);
    }
}


// Save / Update score
async function saveScore(){

    const teamA =
        document.getElementById("teamA").value.trim();

    const teamB =
        document.getElementById("teamB").value.trim();

    const runs =
        Number(document.getElementById("runs").value);

    const wickets =
        Number(document.getElementById("wickets").value);


    if(!teamA || !teamB){

        showMessage(
            "Please enter both team names.",
            false
        );

        return;
    }


    const matchData = {

        team_a: teamA,
        team_b: teamB,
        runs: runs,
        wickets: wickets

    };


    let result;


    // Existing match → UPDATE
    if(matchId){

        result = await supabaseClient
            .from("matches")
            .update(matchData)
            .eq("id", matchId)
            .select()
            .single();

    }

    // No match → CREATE
    else{

        result = await supabaseClient
            .from("matches")
            .insert(matchData)
            .select()
            .single();

    }


    if(result.error){

        showMessage(
            result.error.message,
            false
        );

        return;
    }


    matchId = result.data.id;

    showCurrent(result.data);

    showMessage(
        "✅ Live score updated successfully!",
        true
    );
}


// Display score
function showCurrent(match){

    document.getElementById("currentScore").innerHTML =

        `${match.team_a} 
        <strong>${match.runs}/${match.wickets}</strong>
        ${match.team_b}`;

}


// Message
function showMessage(text, success){

    const box =
        document.getElementById("message");

    box.style.display = "block";

    box.className =
        success ? "success" : "error";

    box.innerText = text;

}


// Start
loadMatch();

</script>

</body>
</html>
